<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <body>
        <div th:fragment="content" class="flex-1 w-full max-w-md mx-auto px-4 py-10 flex items-center justify-center">
            
            <form th:action="@{/users/register}" method="post" class="bg-white p-8 rounded-lg shadow-md flex flex-col gap-8 w-full">

                <div class="flex flex-col gap-2">
                    <h1 class="text-4xl font-bold text-slate-900">
                        Novo Usuário
                    </h1>
                    <p class="text-lg text-slate-500 mt-2">
                        Preencha os dados do novo usuário
                    </p>
                </div>

                <div class="flex flex-col gap-2">
                    <label for="name" class="text-slate-900 text-base font-medium">
                        Nome Completo
                    </label>
                    <input placeholder="Digite o nome completo" id="name" name="name" type="text" required
                        class="w-full px-4 py-2 rounded-lg border border-slate-300 text-slate-900 placeholder-slate-400 focus:outline-none transition-colors">
                </div>

                <div class="flex flex-col gap-2">
                    <label for="email" class="text-slate-900 text-base font-medium">
                        E-mail
                    </label>
                    <input placeholder="Digite o e-mail" id="email" name="email" type="email" required
                        class="w-full px-4 py-2 rounded-lg border border-slate-300 text-slate-900 placeholder-slate-400 focus:outline-none transition-colors">
                </div>

                <div class="flex flex-col gap-2">
                    <label for="role" class="text-slate-900 text-base font-medium">
                        Função
                    </label>
                    <select id="role" name="role" required
                        class="w-full px-4 py-2 rounded-lg border border-slate-300 text-slate-900 bg-white focus:outline-none transition-colors">
                        <option value="" disabled selected>Selecione uma função...</option>
                        <option value="MANAGER">Administrador</option>
                        <option value="TEACHER">Professor</option>
                        <option value="STUDENT">Estudante</option>
                    </select>
                </div>

                <div class="flex items-center gap-4 pt-2">
                    <a th:href="@{/users}" 
                        class="w-1/2 py-3 rounded-lg border border-slate-300 text-slate-700 hover:bg-slate-50 text-center font-medium transition-colors">
                        Cancelar
                    </a>
                    <button type="submit"
                        class="w-1/2 bg-[#043369] hover:bg-[#03254d] text-white py-3 rounded-lg cursor-pointer flex justify-center items-center font-medium transition-colors shadow-sm">
                        <span>Salvar</span>
                    </button>
                </div>

            </form>

        </div>
    </body>
</html>
