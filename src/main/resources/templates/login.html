<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <title>Login</title>
    </head>
    <body class="bg-zinc-100 min-h-screen flex items-center justify-center">
        <main class="w-full max-w-md px-4">
            <form th:action="@{/login}" method="post" class="bg-white p-8 rounded-lg shadow-md flex flex-col gap-8 w-full">

                <div class="flex flex-col gap-2">
                    <h1 class="text-4xl font-bold text-slate-900">
                        Login
                    </h1>
                    <p class="text-lg text-slate-500 mt-2">
                        Informe suas credenciais
                    </p>
                </div>

                <div class="flex flex-col gap-2">
                    <label for="username" class="text-slate-900 text-base font-medium">
                        E-mail
                    </label>
                    <input placeholder="Digite seu e-mail" id="username" name="username" type="text"
                        class="w-full px-4 py-2 rounded-lg border border-slate-300 text-slate-900 placeholder-slate-400 focus:outline-none transition-colors">
                </div>

                <div class="flex flex-col gap-2">
                    <label for="password" class="text-slate-900 text-base font-medium">
                        Senha
                    </label>
                    <input placeholder="Digite sua senha" id="password" name="password" type="password"
                        class="w-full px-4 py-2 rounded-lg border border-slate-300 text-slate-900 placeholder-slate-400 focus:outline-none transition-colors">
                </div>

                <button type="submit"
                    class="bg-[#043369] hover:bg-[#03254d] text-white w-full py-3 rounded-lg cursor-pointer flex justify-center items-center font-medium transition-colors">
                    <span>Entrar</span>
                </button>

            </form>
        </main>
    </body>
</html>
