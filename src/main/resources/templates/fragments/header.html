<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>
    <header class="bg-whi
        te border-b border-slate-200 shadow-sm sticky top-0 z-50 w-full">
        <div class="w-full px-6 lg:px-12">
            <div class="flex justify-between h-20 items-center">

                <div class="flex items-center">
                    <a th:href="@{/home}"
                        class="font-bold text-2xl tracking-tight text-slate-900 hover:text-[#043369] transition-colors">
                        <span class="text-[#043369]">Loginy</span>
                    </a>
                </div>

                <!-- Navegação e Logout juntos à Direita (Desktop) -->
                <div class="hidden md:flex items-center gap-8">
                    <nav class="flex items-center gap-6">
                        <a th:href="@{/home}"
                            class="text-slate-900 font-medium hover:text-[#043369] transition-colors">Início</a>
                        <a th:href="@{/users}"
                            class="text-slate-600 font-medium hover:text-[#043369] transition-colors">Usuários</a>
                    </nav>


                    <form th:action="@{/logout}" method="post" class="m-0">
                        <button type="submit"
                            class="text-sm text-slate-500 hover:text-red-600 font-medium transition-colors cursor-pointer">
                            Sair
                        </button>
                    </form>
                </div>

            </div>
        </div>

        <div id="mobile-menu"
            class="hidden md:hidden bg-white border-b border-slate-200 px-6 pt-2 pb-4 flex flex-col gap-3">
            <a th:href="@{/home}" class="block py-2 text-slate-900 font-medium hover:text-[#043369]">Início</a>
            <a th:href="@{/users}" class="block py-2 text-slate-600 font-medium hover:text-[#043369]">Usuários</a>
            <form th:action="@{/logout}" method="post" class="pt-2 border-t border-slate-100 m-0">
                <button type="submit"
                    class="w-full text-left py-2 text-red-600 font-medium cursor-pointer">Sair</button>
            </form>
        </div>
    </header>
</body>

</html>
